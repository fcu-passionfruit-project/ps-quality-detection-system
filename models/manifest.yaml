schema_version: 1
bundle_version: unbundled-2026-07-22
bundle_status: no_distributed_weights
source_commit: null
runtime:
  python: 3.10.20
  ultralytics: 8.4.59
  torch: 2.12.0
models: {}
planned_models:
  stage1_roi:
    status: pending_training_and_validation
    architecture: yolo26n
    task: detect
    imgsz: 640
    classes:
      - PF
  stage2_color:
    status: pending_training_and_validation
    architecture: yolo26n-cls
    task: classify
    imgsz: 320
    classes:
      - bad_color
      - good_color
  stage2_wrinkle:
    status: pending_training_and_validation
    architecture: yolo26n-cls
    task: classify
    imgsz: 448
    classes:
      - smooth
      - wrinkle
  local_defect_detection:
    status: pending_roboflow_annotation_and_validation
    architecture: yolo26n-seg
    task: segment
    imgsz: 640
    candidate_classes:
      - anthracnose
      - insect_track
      - abrasion
      - insect_bite
feature_contract:
  roi_area_ratio:
    formula: bbox_width * bbox_height / (image_width * image_height)
    meaning: relative fruit bounding-box area within each original photo
    real_world_area: false
    per_station_fields:
      - station_01_roi_area_ratio
      - station_02_roi_area_ratio
      - station_03_roi_area_ratio
  defect_area_ratio:
    formula: defect_mask_pixels / fruit_roi_pixels
    meaning: visible defect area relative to the fruit ROI at each station
    range: [0.0, 1.0]
    field_pattern: "station_{01|02|03}_{anthracnose|insect_track|abrasion|insect_bite}_area_ratio"
    field_count: 12
    no_detection: 0
    invalid_roi_or_inference: null
    formal_source: segmentation_mask
    bbox_proxy_suffix: _bbox_area_ratio
notes:
  - No model weights are distributed by the repository at this time.
  - Candidate class indexes remain unset until Roboflow mask annotation and data.yaml are approved.
  - The frozen snapshot contains 981 images at 1080 x 1920, with 327 images per station.
  - Anthracnose is not a hard-veto feature; all valid fruit rows proceed to XGBoost four-class grading.
